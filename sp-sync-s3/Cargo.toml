[package]
name = "sp-sync-s3"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-smithy-types-convert = { version = "0.61.1", features = ["convert-chrono"] }
aws-sdk-s3 = "1"
save_point_common.path = "../save_point_common"
sutils = { git = "https://github.com/nounfve-deploy/sutils.git", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
serde_yaml = "0.9.34"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
