name: build

on:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nounfve/utoken
          token: ${{ secrets.PULL_TOKEN }}
          path: utoken
      - uses: actions/checkout@v5
        with:
          repository: nounfve/save_point
          token: ${{ secrets.PULL_TOKEN }}
          path: save_point
      - uses: actions/checkout@v5
        with:
          repository: nounfve/save_point_gui
          token: ${{ secrets.PULL_TOKEN }}
          path: save_point_gui
      # toolchain and cache
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: actions/setup-node@v7
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: tauri-cli
      - uses: actions/cache@v6
        with:
          path: target/
          key: save_point_cache-${{ matrix.platform }}
      - name: Install Ubuntu-specific packages
        if: startsWith(matrix.platform, 'ubuntu')
        run: >
          sudo apt-get update &&
          sudo apt-get install -y 
          libwebkit2gtk-4.1-dev 
          build-essential 
          curl 
          wget 
          file 
          libxdo-dev 
          libssl-dev 
          libayatana-appindicator3-dev 
          librsvg2-dev
      # build
      - if: startsWith(matrix.platform, 'ubuntu')
        run: |
          ln -sn /usr/bin/gnome-terminal ./package.dir/sp-pty
        shell: bash
      - if: runner.os == 'Windows'
        run: |
          curl -L -o ./package.dir/sp-pty.exe https://github.com/alacritty/alacritty/releases/download/v0.17.0/Alacritty-v0.17.0-portable.exe
        shell: bash
      - run: |
          (cd save_point && cargo build --release)
          (cd save_point_gui && npm i && cargo tauri build --no-sign)
          (cd mirror_finder && cargo build --release)
        shell: bash
      - run: |
          cp target/release/{save_point*,sp-manager*,mirror_finder*} package.dir/
          rm -f ./package.dir/{*.d,*.pdb}
          mkdir -p xbin.init
          cp package.dir/mirror_finder* ./xbin.init
          ./package.dir/save_point embed copy -f 'xbin.init/*' package.dir/save_point.embed
          cd package.dir/
          ./save_point archive create
          ./save_point archive export save_point.${{ runner.os }}.zip
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: save_point-${{ runner.os }}
          path: package.dir/save_point*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        id: release
        with:
          name: save_point-${{ github.sha }}
          tag_name: dev
          files: ./*
          prerelease: true
          draft: false
          overwrite_files: true
      - uses: nounfve-deploy/save_point_publish/.github/publish_notify@master
        with:
          release-url: ${{ steps.release.outputs.url }}
