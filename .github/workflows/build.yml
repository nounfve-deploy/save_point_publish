name: build

on:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nounfve/utoken
          token: ${{ secrets.PULL_TOKEN }}
          path: utoken
      - uses: actions/checkout@v5
        with:
          repository: nounfve/save_point
          token: ${{ secrets.PULL_TOKEN }}
          path: save_point
      - uses: actions/checkout@v5
        with:
          repository: nounfve/save_point_gui
          token: ${{ secrets.PULL_TOKEN }}
          path: save_point_gui
      # toolchain and cache
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: actions/setup-node@v7
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: tauri-cli
      - uses: actions/cache@v6
        with:
          path: target/
          key: save_point_cache-${{ matrix.platform }}
      - name: Install Ubuntu-specific packages
        if: startsWith(matrix.platform, 'ubuntu')
        run: >
          sudo apt-get update &&
          sudo apt-get install -y 
          libwebkit2gtk-4.1-dev 
          build-essential 
          curl 
          wget 
          file 
          libxdo-dev 
          libssl-dev 
          libayatana-appindicator3-dev 
          librsvg2-dev
      # build
      - run: |
          cd save_point && cargo build --release
          cd ..
          cd save_point_gui && npm i && cargo tauri build --no-sign
      - uses: actions/upload-artifact@v7
        with:
          name: save_point-${{ matrix.platform }}
          path: |
            target/release/save_point
            target/release/save_point.exe
            target/release/sp-manager
            target/release/sp-manager.exe
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
      - name: Zip All Artifacts
        run: |
          for dir in */;            
          do (cd "${dir}" && zip -r "../${dir%/}.zip" ".");
          done
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: save_point-${{ github.sha }}
          tag_name: dev
          files: ./*.zip
          prerelease: true
          draft: false
          overwrite_files: true
