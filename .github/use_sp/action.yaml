name: install save_point cli
runs:
  using: composite
  steps:
    - working-directory: ${{ env.HOME }}
      shell: bash
      run: |
        curl -sSL https://github.com/nounfve-deploy/save_point_publish/releases/download/dev/save_point-${{ runner.os }}.zip -o save_point.zip
        unzip save_point.zip && chmod +x ./save_point
        mkdir -p ~/.local/bin/
        realpath ~/.local/bin/ >> $GITHUB_PATH
        ./save_point env install
        save_point --help
