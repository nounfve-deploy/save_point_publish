[package]
name = "mirror_finder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["stream"] }
tokio = { version = "1.53.1", features = ["full"] }
save_point_common.path = "../save_point_common"
serde_yaml = "0.9.34"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
